Description: Telepad turns an Android phone into a wireless trackpad, keyboard and media remote for a Windows, Linux or macOS computer, over a local Wi-Fi network or Bluetooth. This is the program for the PC. It sits in the tray and shows a QR code that a phone scans to pair. Everything is end-to-end encrypted, and nothing is sent to any server.
