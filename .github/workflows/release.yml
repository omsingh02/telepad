name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v2.0.0)'
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # An APK and a server that call themselves a different version from the tag they are
  # published under break update checks and confuse bug reports, so stop before building.
  check-version:
    name: Check Tag Matches Versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The desktop programs ship with the licenses of the libraries inside them, which come from Cargo.lock.
      - name: Install cargo-about
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/install-ci-tool.sh EmbarkStudios/cargo-about 0.9.2 cargo-about

      - name: Check the third-party license notice is current
        run: scripts/update-licenses.sh --check

      - name: Compare the tag with the app and server versions
        run: |
          VERSION="${TAG#v}"
          VERSION="${VERSION%%-*}"   # a pre-release tag such as v2.1.0-rc1 releases 2.1.0
          APP=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts | head -n 1)
          SERVER=$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -n 1)
          echo "Tag $TAG is version $VERSION; Android app $APP; desktop server $SERVER"
          if [ "$VERSION" != "$APP" ] || [ "$VERSION" != "$SERVER" ]; then
            echo "::error::Tag $TAG is version $VERSION, but the Android app is $APP and the desktop server is $SERVER. Make them match, then tag again."
            exit 1
          fi

  build-android:
    name: Build Android Release APK
    needs: check-version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Prepare Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || 'nwerf' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets are required for release builds."
            exit 1
          fi
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          printf "storeFile=app/release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties

      - name: Test and Build Release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ format('{0}/android/app/release.keystore', github.workspace) }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || 'nwerf' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        # The tests run against the debug build, as in CI: the screen tests need the test
        # activity that Compose only adds to debug builds. The release build is still R8-minified.
        run: ./gradlew testDebugUnitTest assembleRelease -x lint --no-daemon --stacktrace

      - name: Stage APK for release
        run: |
          mkdir -p dist
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::Release APK was not generated at $APK_SRC"
            exit 1
          fi
          cp "$APK_SRC" "dist/telepad-android-${TAG}.apk"
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android
          path: dist/*.apk
          retention-days: 7

  build-desktop-windows:
    name: Build Windows Desktop Apps
    needs: check-version
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # Signing is switched on by adding these (see docs/code-signing.md); without them the build is unsigned.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    outputs:
      signed: ${{ steps.signed.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run Cargo Tests (Release Test Gate)
        run: cargo test --workspace --locked --verbose

      # CI is set, so a build that cannot embed the icon and version information fails instead of shipping without.
      - name: Build the apps
        run: cargo build --release --locked --bin telepad --bin telepad-server

      - name: Check the program has its icon and name
        shell: pwsh
        run: |
          $info = (Get-Item target/release/telepad.exe).VersionInfo
          Write-Host "ProductName=$($info.ProductName) FileDescription=$($info.FileDescription) Version=$($info.FileVersion)"
          if ($info.FileDescription -ne 'Telepad') { throw "telepad.exe has no version information" }

      # --- Signing the programs (only when the SignPath account is set up) -----------------------------
      - name: Collect the programs to sign
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path unsigned | Out-Null
          Copy-Item target/release/telepad.exe, target/release/telepad-server.exe unsigned/

      - name: Upload the programs to sign
        id: unsigned-programs
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows-programs
          path: unsigned/*.exe
          retention-days: 1

      - name: Sign the programs (SignPath)
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'telepad' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: programs
          github-artifact-id: ${{ steps.unsigned-programs.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-programs

      - name: Use the signed programs
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        run: Copy-Item signed-programs/*.exe target/release/ -Force

      # --- The installer, from the programs above (signed or not) ---------------------------------------
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $version = ($env:TAG -replace '^v', '') -replace '-.*$', ''
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Host }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc "/DVersion=$version" "/DSource=$PWD\target\release\telepad.exe" "/DOutputDir=$PWD\dist" "/DOutputName=telepad-$($env:TAG)-windows-x86_64-setup" packaging\windows\telepad.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Upload the installer to sign
        id: unsigned-installer
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows-installer
          path: dist/*-setup.exe
          retention-days: 1

      - name: Sign the installer (SignPath)
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'telepad' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer

      - name: Use the signed installer
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        run: Copy-Item signed-installer/*-setup.exe dist/ -Force

      - name: Record whether this build is signed
        id: signed
        shell: pwsh
        run: |
          $signed = if ($env:SIGNPATH_API_TOKEN) { 'true' } else { 'false' }
          "signed=$signed" >> $env:GITHUB_OUTPUT

      - name: Stage Windows files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach ($exe in 'telepad.exe', 'telepad-server.exe') {
            if (-not (Test-Path "target/release/$exe")) { throw "Windows binary not found: target/release/$exe" }
          }
          Copy-Item target/release/telepad.exe "dist/telepad-${env:TAG}-windows-x86_64.exe"
          Copy-Item target/release/telepad-server.exe "dist/telepad-server-${env:TAG}-windows-x86_64.exe"
          Compress-Archive -Path target/release/telepad-server.exe, LICENSE, THIRD_PARTY_LICENSES.md -DestinationPath "dist/telepad-server-${env:TAG}-windows-x86_64.zip" -Force
          Get-ChildItem dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 7

  build-desktop-linux:
    name: Build Linux Desktop Apps
    needs: check-version
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run Cargo Tests (Release Test Gate)
        run: cargo test --workspace --locked --verbose

      - name: Build the apps
        run: cargo build --release --locked --bin telepad --bin telepad-server

      - name: Package
        run: |
          mkdir -p dist
          for bin in telepad telepad-server; do
            if [ ! -f "target/release/$bin" ]; then
              echo "::error::Linux binary not found at target/release/$bin"
              exit 1
            fi
            chmod +x "target/release/$bin"
          done
          bash packaging/linux/package.sh "telepad-${TAG}-linux-x86_64" target/release/telepad dist
          tar -czvf "dist/telepad-server-${TAG}-linux-x86_64.tar.gz" -C target/release telepad-server -C "$PWD" LICENSE THIRD_PARTY_LICENSES.md
          ls -la dist

      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: dist/*.tar.gz
          retention-days: 7

  build-desktop-macos:
    name: Build macOS Desktop Apps (universal)
    needs: check-version
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Signing and notarization are switched on by adding these (see docs/code-signing.md); without them the
      # app is only ad-hoc signed and macOS asks the person to allow it.
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    outputs:
      signed: ${{ steps.signed.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run Cargo Tests (Release Test Gate)
        run: cargo test --workspace --locked --verbose

      - name: Build both architectures
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --bin telepad --bin telepad-server --target "$target"
          done

      - name: Create universal binaries
        run: |
          mkdir -p dist universal
          for bin in telepad telepad-server; do
            lipo -create -output "universal/$bin" \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin"
            lipo -info "universal/$bin"
            chmod +x "universal/$bin"
          done
          tar -czvf "dist/telepad-server-${TAG}-macos-universal.tar.gz" -C universal telepad-server -C "$PWD" LICENSE THIRD_PARTY_LICENSES.md

      - name: Build the app
        run: |
          VERSION="${TAG#v}"
          VERSION="${VERSION%%-*}"
          bash packaging/macos/make-app.sh "$VERSION" universal/telepad app

      # Ad hoc without the Apple credentials; with them: Developer ID, notarized and stapled.
      - name: Sign the app
        run: bash packaging/macos/sign-and-notarize.sh app app/Telepad.app

      - name: Make the disk image
        run: bash packaging/macos/make-dmg.sh "telepad-${TAG}-macos-universal" app/Telepad.app dist

      - name: Check the disk image opens and the app in it runs
        run: |
          mkdir -p "$RUNNER_TEMP/dmg"
          hdiutil attach "dist/telepad-${TAG}-macos-universal.dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg"
          ls -la "$RUNNER_TEMP/dmg"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/dmg/Telepad.app"
          "$RUNNER_TEMP/dmg/Telepad.app/Contents/MacOS/telepad" --version
          hdiutil detach "$RUNNER_TEMP/dmg"

      - name: Record whether this build is signed and notarized
        id: signed
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_CERTIFICATE_BASE64" ] && [ -n "$APPLE_API_KEY_BASE64" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: |
            dist/*.dmg
            dist/*.tar.gz
          retention-days: 7

  publish-release:
    name: Publish Release Assets
    needs: [build-android, build-desktop-windows, build-desktop-linux, build-desktop-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # For the build-provenance attestation of every file.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Record Commit SHA
        id: meta
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      # Only the finished files: the signing steps leave temporary artifacts of their own, which must not be published.
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      # The same files again under names without the version, so that links such as
      # .../releases/latest/download/telepad-android.apk keep working from release to release
      # (the website's download buttons use them).
      - name: Add version-less copies of each file
        working-directory: release-assets
        run: |
          for f in *; do
            alias="${f/-${TAG}/}"
            if [ -f "$f" ] && [ "$alias" != "$f" ]; then
              cp -- "$f" "$alias"
            fi
          done
          ls -la

      - name: Generate Checksums
        working-directory: release-assets
        run: |
          echo "Release assets staged:"
          ls -la
          # Write to a temporary file first, or the checksum file would list itself.
          for f in *; do
            if [ -f "$f" ]; then
              sha256sum -- "$f"
            fi
          done > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          echo "Generated SHA256SUMS:"
          cat SHA256SUMS

      # A signed statement, kept by GitHub, of which workflow run built each file from which commit:
      #   gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest where the files were built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS

      # The release text is the changelog section for this version, followed by GitHub's own list
      # of what changed.
      - name: Write the release notes
        env:
          WINDOWS_SIGNED: ${{ needs.build-desktop-windows.outputs.signed }}
          MACOS_SIGNED: ${{ needs.build-desktop-macos.outputs.signed }}
        run: |
          VERSION="${TAG#v}"
          VERSION="${VERSION%%-*}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md has no section for $VERSION, so the release text is only what GitHub generates."
          fi
          {
            cat <<'EOF'

          ### Which file do I need?

          | You have | Download |
          | --- | --- |
          | An Android phone | `telepad-android.apk` |
          | A Windows PC | `telepad-windows-x86_64-setup.exe` (installer), or `telepad-windows-x86_64.exe` to run without installing |
          | A Mac | `telepad-macos-universal.dmg` |
          | A Linux PC | `telepad-linux-x86_64.tar.gz`, then run `./install.sh` in the unpacked folder |

          For a PC with no desktop, there is also a console-only server: `telepad-server-windows-x86_64.exe` (or `.zip`), `telepad-server-linux-x86_64.tar.gz` and `telepad-server-macos-universal.tar.gz`.

          Telepad on the PC shows a QR code the first time it starts: scan it with the Telepad app on your phone.

          ### If your system warns you

          - **Android** asks to allow installs from your browser or file manager the first time: allow it for this install.
          EOF
            if [ "$WINDOWS_SIGNED" != "true" ]; then
              echo '- **Windows** may say "Windows protected your PC", because this build is not code-signed yet. Choose **More info**, then **Run anyway**.'
            fi
            if [ "$MACOS_SIGNED" != "true" ]; then
              echo '- **macOS** may say it cannot verify Telepad, because this build is not notarized yet. Open **System Settings > Privacy & Security** and choose **Open Anyway**. macOS also asks to let Telepad control the computer (Accessibility): allow it, or the phone cannot type or click.'
            else
              echo '- **macOS** asks to let Telepad control the computer (Accessibility): allow it, or the phone cannot type or click.'
            fi
            cat <<'EOF'

          ### Check what you downloaded

          Every file is listed in `SHA256SUMS`, and GitHub holds a signed statement of which build produced each one:

          ```
          gh attestation verify telepad-android.apk --repo ${{ github.repository }}
          ```

          Setup instructions are in the [README](https://github.com/${{ github.repository }}#quick-start).
          EOF
          } >> release-notes.md

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ steps.meta.outputs.commit_sha }}
          name: Telepad ${{ env.TAG }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
          files: release-assets/*
