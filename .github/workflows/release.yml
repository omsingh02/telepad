name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: false
        default: 'v1.0.1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Determine Release Tag
        id: vars
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.0.1"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Prepare Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || 'nwerf' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/app
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            cat <<EOF > android/keystore.properties
            storeFile=app/release.keystore
            storePassword=$KEYSTORE_PASSWORD
            keyAlias=$KEY_ALIAS
            keyPassword=$KEY_PASSWORD
            EOF
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build with Gradle
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.has_keystore == 'true' && format('{0}/android/app/release.keystore', github.workspace) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || 'nwerf' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease -x lintVitalRelease -x lint --stacktrace

      - name: Stage APKs for release
        run: |
          mkdir -p dist
          TAG="${{ steps.vars.outputs.tag }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/telepad-android-${TAG}-debug.apk
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/telepad-android-${TAG}-release-signed.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/telepad-android-${TAG}-release-unsigned.apk
          fi
          ls -la dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telepad-apks
          path: dist/*.apk
          retention-days: 14

  build-server-windows:
    name: Build Windows Desktop Server
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Server Release
        run: cargo build --release --bin telepad-server

      - name: Stage Windows binary
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/telepad-server.exe dist/telepad-server-windows-x86_64.exe

      - name: Upload Windows Server artifact
        uses: actions/upload-artifact@v4
        with:
          name: telepad-server-windows
          path: dist/telepad-server-windows-x86_64.exe
          retention-days: 14

  build-server-linux:
    name: Build Linux Desktop Server
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Server Release
        run: cargo build --release --bin telepad-server

      - name: Stage Linux binary
        run: |
          mkdir -p dist
          cp target/release/telepad-server dist/telepad-server-linux-x86_64

      - name: Upload Linux Server artifact
        uses: actions/upload-artifact@v4
        with:
          name: telepad-server-linux
          path: dist/telepad-server-linux-x86_64
          retention-days: 14

  publish-release:
    name: Publish Release Assets
    needs: [build-android, build-server-windows, build-server-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine Release Tag
        id: vars
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.0.1"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: List Release Files
        run: |
          echo "Files to publish:"
          ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Telepad ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
