name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease -x lintVitalRelease -x lint --stacktrace

      - name: Sign Android Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

      - name: Rename APKs for release
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/telepad-android-${{ github.ref_name }}-debug.apk
          if [ -f "${{ steps.sign_app.outputs.signedReleaseFile }}" ]; then
            cp "${{ steps.sign_app.outputs.signedReleaseFile }}" dist/telepad-android-${{ github.ref_name }}-release-signed.apk
          else
            cp android/app/build/outputs/apk/release/app-release.apk dist/telepad-android-${{ github.ref_name }}-release-signed.apk
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telepad-apks
          path: dist/*.apk
          retention-days: 14

  build-server-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Server Release
        run: cargo build --release --bin telepad-server

      - name: Rename binary for release
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/telepad-server.exe dist/telepad-server-windows-x86_64.exe

      - name: Upload Windows Server artifact
        uses: actions/upload-artifact@v4
        with:
          name: telepad-server-windows
          path: dist/telepad-server-windows-x86_64.exe
          retention-days: 14

  publish-release:
    needs: [build-android, build-server-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          files: release-assets/*
