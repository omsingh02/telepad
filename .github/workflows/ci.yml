name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android:
    name: Android Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

  rust:
    name: Rust Workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Cargo Tests
        run: cargo test --workspace --verbose
      - name: Build Rust Server Release
        run: cargo build --release --bin telepad-server

  server-c:
    name: Legacy C Server (Windows)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Clone noise-c dependency
        run: git clone https://github.com/rweather/noise-c server/third_party/noise-c
      - name: Configure CMake
        run: cmake -B server/build -S server
      - name: Build Server
        run: cmake --build server/build --config Release
      - name: Run Server Tests
        run: ctest --test-dir server/build -C Release --output-on-failure
