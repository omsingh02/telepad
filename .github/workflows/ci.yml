name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
      rust: ${{ steps.filter.outputs.rust }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # What the packaging below is told the version is: a release candidate of the code's own version, so that
      # the apps are built the way a release builds them (with a whole version, as in 2.0.0-rc.0).
      - name: The version to package as
        id: version
        run: echo "version=$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -n 1)-rc.0" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'crates/telepad-protocol/**'
              - '.github/workflows/**'
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'packaging/**'
              - 'website/install.sh'
              - '.github/workflows/**'

  android:
    name: Android Build & Test
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew
      # Unit tests include the network tests (a real Noise handshake against a stand-in PC on
      # loopback) and the screenshot tests, which render every screen with Robolectric.
      # Lint errors fail the build; its warnings (such as newer library versions) do not.
      - name: Build debug APK, run unit tests and lint
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon

  rust:
    name: Rust Workspace (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev desktop-file-utils
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Formatting does not depend on the OS (rustfmt reads every platform's files), so once is enough.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      # Each OS lints its own backend (uinput, SendInput, CoreGraphics), which a
      # single-platform lint run would never even compile.
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run Cargo Tests
        run: cargo test --workspace --locked --verbose

      # A release builds the apps with their whole version in the environment (2.0.0-alpha.4, not only 2.0.0), and
      # runs the tests that way before it builds. Run them that way here too, so that a test which only holds for
      # the plain version fails in a pull request and not on the day of a release.
      - name: Run Cargo Tests as a release does
        if: runner.os == 'Linux'
        env:
          TELEPAD_RELEASE_VERSION: 2.0.0-alpha.99
        run: cargo test --workspace --locked

  # Everything a release ships, built and tried: the same workflow the release runs, so that a release is this with a
  # tag on it. (It builds the apps in release mode, so it is the one place that does.)
  package:
    name: Package
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.android == 'true' }}
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.changes.outputs.version }}
