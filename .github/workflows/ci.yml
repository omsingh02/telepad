name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'crates/telepad-protocol/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'packaging/**'
              - 'website/install.sh'
              - '.github/workflows/ci.yml'

  android:
    name: Android Build & Test
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew
      # Unit tests include the network tests (a real Noise handshake against a stand-in PC on
      # loopback) and the screenshot tests, which render every screen with Robolectric.
      # Lint errors fail the build; its warnings (such as newer library versions) do not.
      - name: Build debug APK, run unit tests and lint
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
      # The release build is minified with R8, which can break things the debug build never
      # shows. Building it here catches that before a release is tagged (it is left unsigned).
      - name: Build minified release APK
        working-directory: android
        run: ./gradlew assembleRelease -x lint --no-daemon

  rust:
    name: Rust Workspace (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev desktop-file-utils
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Formatting does not depend on the OS (rustfmt reads every platform's files), so once is enough.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      # Each OS lints its own backend (uinput, SendInput, CoreGraphics), which a
      # single-platform lint run would never even compile.
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run Cargo Tests
        run: cargo test --workspace --locked --verbose

      # A release builds the apps with their whole version in the environment (2.0.0-alpha.4, not only 2.0.0), and
      # runs the tests that way before it builds. Run them that way here too, so that a test which only holds for
      # the plain version fails in a pull request and not on the day of a release.
      - name: Run Cargo Tests as a release does
        if: runner.os == 'Linux'
        env:
          TELEPAD_RELEASE_VERSION: 2.0.0-alpha.99
        run: cargo test --workspace --locked
      # CI is set, so on Windows a build that cannot embed the icon and version information fails.
      - name: Build the apps (release)
        run: cargo build --release --locked --bin telepad --bin telepad-server

      # The packages are made from what was just built, the way a release makes them and installed the way a
      # person would, so that a mistake in the packaging shows up here and not after a tag is pushed.
      - name: Check the Linux package
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate packaging/linux/telepad.desktop
          bash packaging/linux/package.sh telepad-ci-linux-x86_64 target/release/telepad "$RUNNER_TEMP/dist"
          mkdir -p "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/home"
          tar -xzf "$RUNNER_TEMP/dist/telepad-ci-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/unpacked"
          export HOME="$RUNNER_TEMP/home" XDG_CONFIG_HOME="$RUNNER_TEMP/home/.config"
          "$RUNNER_TEMP/unpacked/telepad-ci-linux-x86_64/install.sh"
          "$HOME/.local/bin/telepad" --version
          desktop-file-validate "$HOME/.local/share/applications/telepad.desktop"
          "$RUNNER_TEMP/unpacked/telepad-ci-linux-x86_64/install.sh" --uninstall
          test ! -e "$HOME/.local/bin/telepad"

      # The .deb, .rpm and Arch packages: built, then installed in real Debian, Ubuntu, Fedora and Arch (containers),
      # run, and removed; and the one-line installer (website/install.sh) tried the same way.
      - name: Check the Linux system packages
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/install-nfpm.sh 2.47.0
          export PATH="$RUNNER_TEMP/nfpm:$PATH"
          VERSION="$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -n 1)"
          bash packaging/linux/package.sh telepad-v0.0.0-linux-x86_64 target/release/telepad "$RUNNER_TEMP/packages"
          bash packaging/linux/build-packages.sh v0.0.0 telepad-v0.0.0-linux-x86_64 target/release/telepad "$RUNNER_TEMP/packages"
          bash packaging/linux/tests/run.sh "$RUNNER_TEMP/packages" "$VERSION"
          # And the one-line installer, end to end against a stand-in for GitHub serving these files as a release.
          bash packaging/linux/tests/installer.sh "$RUNNER_TEMP/packages" v0.0.0 "$VERSION"

      - name: Check the macOS package
        if: runner.os == 'macOS'
        run: |
          bash packaging/macos/make-app.sh 0.0.0 target/release/telepad "$RUNNER_TEMP/app"
          bash packaging/macos/sign-and-notarize.sh app "$RUNNER_TEMP/app/Telepad.app"
          bash packaging/macos/make-dmg.sh telepad-ci-macos "$RUNNER_TEMP/app/Telepad.app" "$RUNNER_TEMP/dist"
          "$RUNNER_TEMP/app/Telepad.app/Contents/MacOS/telepad" --version

      - name: Check the Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $info = (Get-Item target/release/telepad.exe).VersionInfo
          if ($info.FileDescription -ne 'Telepad') { throw "telepad.exe has no version information" }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Host }
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          & $iscc "/DVersion=0.0.0" "/DSource=$PWD\target\release\telepad.exe" "/DOutputDir=$dist" "/DOutputName=telepad-ci-setup" packaging\windows\telepad.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          # Install, look, uninstall: what a person does, without the clicks.
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Telepad'
          Start-Process -FilePath (Join-Path $dist 'telepad-ci-setup.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=autostart' -Wait
          if (-not (Test-Path "$dir\telepad.exe")) { throw "the installer did not install telepad.exe" }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').Telepad
          if ($run -ne "`"$dir\telepad.exe`" --background") { throw "the start-at-sign-in entry is wrong: $run" }
          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller hands over to a copy of itself and returns at once, so wait for the files to go.
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\telepad.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\telepad.exe") { throw "the uninstaller did not remove telepad.exe" }
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').Telepad) { throw "the start-at-sign-in entry was left behind" }
