[package]
name = "telepad-update"
description = "Finds out whether a newer Telepad has been released, and installs it: the part of the desktop app that talks to GitHub"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
# Programs and libraries of this project only: nothing here is published to crates.io.
publish = false

[dependencies]
telepad-protocol = { path = "../telepad-protocol" }
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Talks HTTPS to GitHub, and nothing else: no cookies, no proxies of its own beyond the environment's.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
