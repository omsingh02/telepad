[package]
name = "telepad-tray"
description = "Telepad for the desktop: the server with a tray icon, a QR code to pair with, and starting at login"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
# Programs and libraries of this project only: nothing here is published to crates.io.
publish = false

[[bin]]
name = "telepad"
path = "src/main.rs"

[dependencies]
telepad-protocol = { path = "../telepad-protocol" }
telepad-crypto = { path = "../telepad-crypto" }
telepad-platform = { path = "../telepad-platform" }
telepad-server = { path = "../telepad-server" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
hostname.workspace = true
base64.workspace = true
# The page with the QR code, served to this computer only.
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Opens that page in the browser.
open = "5"

# Linux: the tray icon speaks D-Bus (StatusNotifierItem) directly, so nothing but the
# kernel's and the desktop's own services is needed, and no GTK.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"

# Windows and macOS: the tray icon and the loop that serves it.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }
tao = "0.37"

# macOS draws the icon on the next turn of its run loop, which has to be asked for.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop"] }

# Windows: a message box, for errors, since a program without a console has nowhere to print them.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
