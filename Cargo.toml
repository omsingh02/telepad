[workspace]
members = [
    "crates/telepad-protocol",
    "crates/telepad-crypto",
    "crates/telepad-server",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["Om Singh"]
license = "MIT"
repository = "https://github.com/omsingh02/telepad"

[workspace.dependencies]
thiserror = "2.0"
bytes = "1.9"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snow = "0.9"
sha2 = "0.10"
base64 = "0.22"
subtle = "2.6"
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
arboard = "3.4"
hostname = "0.4"
